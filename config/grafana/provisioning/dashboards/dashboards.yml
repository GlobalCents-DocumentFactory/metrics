apiVersion: 1

# Dashboard provisioning configuration for DocumentFactory observability dashboards
providers:
  - name: "documentfactory-dashboards"
    orgId: 1
    folder: "DocumentFactory"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
    folderUid: "documentfactory"
