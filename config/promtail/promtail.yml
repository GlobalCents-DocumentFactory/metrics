server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ptfd-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ptfd-service
          __path__: /var/log/ptfd/*.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            # map the "correlationId" field from JSON to a temporary label
            correlation_id: correlationId
            message: message
            exception: exception
      - labels:
          level:
          logger:
          # promote extracted correlation_id to a real index label
          correlation_id:
